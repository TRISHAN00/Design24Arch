    <script>
      function toggleMenu() {
        const mobileMenu = document.querySelector(".mobile-menu");
        const currentRight = mobileMenu.style.right;

        if (currentRight === "0px") {
          mobileMenu.style.right = "-100%"; // Close the menu
        } else {
          mobileMenu.style.right = "0"; // Open the menu
        }
      }
